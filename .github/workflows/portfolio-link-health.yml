name: Portfolio link health

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/portfolio-link-health.yml"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-link-health
  cancel-in-progress: true

jobs:
  check-public-routes:
    name: Check public portfolio routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gateway HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class StructureCheck(HTMLParser):
              VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          raise ValueError(f"Duplicate id: {attrs['id']}")
                      self.ids.add(attrs["id"])
                  if tag not in self.VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if not self.stack or self.stack[-1] != tag:
                      raise ValueError(f"Unexpected closing tag: </{tag}>; stack={self.stack[-5:]}")
                  self.stack.pop()

          html = Path("index.html").read_text(encoding="utf-8")
          parser = StructureCheck()
          parser.feed(html)
          parser.close()
          if parser.stack:
              raise SystemExit(f"Unclosed HTML tags: {parser.stack}")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/portfolio-inline.js").write_text(scripts[0], encoding="utf-8")
          print(f"HTML structure valid; {len(parser.ids)} unique IDs; inline script extracted.")
          PY
          node --check /tmp/portfolio-inline.js

      - name: Check production applications and repositories
        shell: bash
        run: |
          set -uo pipefail

          urls=(
            "https://michaelkage.github.io/"
            "https://michaelkage.github.io/campus-plug67/"
            "https://michaelkage.github.io/OmniPocket/"
            "https://michaelkage.github.io/wastelens-dashboard-prototype/"
            "https://github.com/michaelkage/michaelkage"
            "https://github.com/michaelkage/Daily-Log"
            "https://github.com/michaelkage/The-Vault"
            "https://github.com/michaelkage/campus-plug67"
            "https://github.com/michaelkage/JaFaFaWeb"
            "https://github.com/michaelkage/RecordsDataBase"
            "https://github.com/michaelkage/MinecraftServer"
            "https://github.com/michaelkage/LaundrySolution"
            "https://github.com/michaelkage/OmniPocket"
            "https://github.com/michaelkage/wastelens-dashboard-prototype"
            "https://github.com/michaelkage/Terranova"
            "https://github.com/michaelkage/unilag-watcher"
            "https://github.com/michaelkage/autonomous-media-network"
            "https://github.com/michaelkage/Life-Itself"
            "https://github.com/michaelkage/OmniRoute"
            "https://github.com/michaelkage/Ai-Gateway"
            "https://github.com/michaelkage/Axiom"
            "https://github.com/michaelkage/OmniLauncher"
            "https://github.com/michaelkage/Vanguard"
          )

          failures=0
          for url in "${urls[@]}"; do
            printf 'Checking %s ... ' "$url"
            if status=$(curl --location --silent --show-error --fail \
              --retry 2 --retry-delay 2 --max-time 25 \
              --output /dev/null --write-out '%{http_code}' "$url"); then
              printf 'HTTP %s\n' "$status"
            else
              printf 'FAILED\n'
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -gt 0 ]; then
            printf '\n%s route(s) failed health checks.\n' "$failures"
            exit 1
          fi

          printf '\nAll portfolio routes are responding.\n'
