name: Gateway link health

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - ".github/workflows/portfolio-link-health.yml"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-link-health
  cancel-in-progress: true

jobs:
  check-public-routes:
    name: Check public gateway routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gateway HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class StructureCheck(HTMLParser):
              VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          raise ValueError(f"Duplicate id: {attrs['id']}")
                      self.ids.add(attrs["id"])
                  if tag not in self.VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if not self.stack or self.stack[-1] != tag:
                      raise ValueError(f"Unexpected closing tag: </{tag}>; stack={self.stack[-5:]}")
                  self.stack.pop()

          html = Path("index.html").read_text(encoding="utf-8")
          parser = StructureCheck()
          parser.feed(html)
          parser.close()
          if parser.stack:
              raise SystemExit(f"Unclosed HTML tags: {parser.stack}")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/portfolio-inline.js").write_text(scripts[0], encoding="utf-8")
          print(f"HTML structure valid; {len(parser.ids)} unique IDs; inline script extracted.")
          PY
          node --check /tmp/portfolio-inline.js

      - name: Validate application lifecycle manager
        shell: bash
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scriptStart = html.indexOf("<script>");
          const scriptEnd = html.indexOf("</script>", scriptStart);
          const script = scriptStart >= 0 && scriptEnd > scriptStart ? html.slice(scriptStart + 8, scriptEnd) : "";
          if (!script) throw new Error("Inline application script not found.");
          for (const token of ["mk.system.session.v1", "mk.system.launch-history.v1", "restoreSession", "stableAppId", "faulted", "minimized"]) {
            if (!script.includes(token)) throw new Error("Lifecycle feature missing: " + token);
          }
          for (const id of ["desktop-restore-session", "desktop-history-toggle"]) {
            if (!html.includes('id="' + id + '"')) throw new Error("Missing lifecycle control: " + id);
          }
          console.log("Stable app identity, session recovery, lifecycle states, and launch history are present.");
          JS

      - name: Validate repository telemetry recovery
        shell: bash
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          const script = start >= 0 && end > start ? html.slice(start + 8, end) : "";
          if (!html.includes('id="telemetry-refresh"')) {
            throw new Error("Repository telemetry retry control is missing.");
          }
          if (!/telemetryRefresh\.addEventListener\("click",\s*loadRepositoryTelemetry\)/.test(script)) {
            throw new Error("Repository telemetry retry control is not connected to its loader.");
          }
          if (!/telemetryRefresh\.disabled\s*=\s*false/.test(script)) {
            throw new Error("Repository telemetry retry control is not re-enabled after requests.");
          }
          if (script.includes("retry on page refresh")) {
            throw new Error("Obsolete full-page retry instruction remains in telemetry errors.");
          }
          console.log("Repository telemetry has a dedicated, recoverable retry path.");
          JS

      - name: Validate installable offline shell
        shell: bash
        run: |
          node --check sw.js
          node - <<'JS'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const manifest = JSON.parse(fs.readFileSync("manifest.webmanifest", "utf8"));
          const icon = fs.readFileSync("icons/mk-system.svg", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");
          if (manifest.start_url !== "./" || manifest.scope !== "./" || manifest.display !== "standalone") {
            throw new Error("Manifest must launch the root gateway in standalone mode.");
          }
          if (!Array.isArray(manifest.icons) || !manifest.icons.some(icon => icon.src === "./icons/mk-system.svg")) {
            throw new Error("Manifest is missing the MK.SYSTEMS application icon.");
          }
          const metaTheme = html.match(/<meta name="theme-color" content="([^"]+)"/)?.[1];
          if (!metaTheme || metaTheme !== manifest.theme_color || manifest.background_color !== manifest.theme_color) {
            throw new Error("Browser theme, PWA theme, and PWA background colors must match.");
          }
          if (/linearGradient|radialGradient/.test(icon)) {
            throw new Error("The editorial application icon must not contain gradients.");
          }
          for (const token of ["--bg: #eeeae1", "--text: #171715", "--cyan: #d83a25", "--display:"]) {
            if (!html.includes(token)) throw new Error("Editorial design token missing: " + token);
          }
          if (!/CACHE_NAME\s*=\s*CACHE_PREFIX\s*\+\s*"v3"/.test(sw)) {
            throw new Error("The shell cache must be versioned for the current icon and manifest.");
          }
          for (const file of ["sw.js", "icons/mk-system.svg"]) {
            if (!fs.existsSync(file)) throw new Error("Missing PWA asset: " + file);
          }
          console.log("Manifest, matching theme colors, editorial tokens, flat icon, and versioned service worker are valid.");
          JS

      - name: Wait for the root shell deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          root="https://michaelkage.github.io"
          expected_cache_line=$(grep -F 'const CACHE_NAME = CACHE_PREFIX +' sw.js | head -n 1)
          if [ -z "$expected_cache_line" ]; then
            echo "Could not determine the expected service-worker cache version."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 "$root/sw.js" -o /tmp/live-sw.js 2>/dev/null &&
              grep -Fq "$expected_cache_line" /tmp/live-sw.js &&
              curl --fail --silent --show-error --max-time 10 "$root/manifest.webmanifest" -o /dev/null 2>/dev/null; then
              echo "The deployed root shell matches the repository service-worker version."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/60)..."
            sleep 10
          done
          echo "The current root shell was not published within 10 minutes."
          exit 1

      - name: Check production applications and repositories
        shell: bash
        run: |
          set -uo pipefail

          urls=(
            "https://michaelkage.github.io/"
            "https://michaelkage.github.io/manifest.webmanifest"
            "https://michaelkage.github.io/sw.js"
            "https://michaelkage.github.io/icons/mk-system.svg"
            "https://michaelkage.github.io/campus-plug67/"
            "https://michaelkage.github.io/OmniPocket/"
            "https://michaelkage.github.io/wastelens-dashboard-prototype/"
            "https://github.com/michaelkage/michaelkage"
            "https://github.com/michaelkage/Daily-Log"
            "https://github.com/michaelkage/The-Vault"
            "https://github.com/michaelkage/campus-plug67"
            "https://github.com/michaelkage/JaFaFaWeb"
            "https://github.com/michaelkage/RecordsDataBase"
            "https://github.com/michaelkage/MinecraftServer"
            "https://github.com/michaelkage/LaundrySolution"
            "https://github.com/michaelkage/OmniPocket"
            "https://github.com/michaelkage/wastelens-dashboard-prototype"
            "https://github.com/michaelkage/Terranova"
            "https://github.com/michaelkage/unilag-watcher"
            "https://github.com/michaelkage/autonomous-media-network"
            "https://github.com/michaelkage/Life-Itself"
            "https://github.com/michaelkage/OmniRoute"
            "https://github.com/michaelkage/Ai-Gateway"
            "https://github.com/michaelkage/Axiom"
            "https://github.com/michaelkage/OmniLauncher"
            "https://github.com/michaelkage/Vanguard"
          )

          results_file="$(mktemp)"
          export results_file
          printf '%s\0' "${urls[@]}" | xargs -0 -P 8 -I '{}' bash -c '
            url="$1"
            if status=$(curl --location --silent --show-error --fail \
              --retry 2 --retry-delay 2 --max-time 20 \
              --output /dev/null --write-out "%{http_code}" "$url"); then
              printf "OK %s %s\n" "$status" "$url" >> "$results_file"
            else
              printf "FAIL - %s\n" "$url" >> "$results_file"
            fi
          ' _ '{}'

          sort "$results_file"
          failures=$(grep -c '^FAIL ' "$results_file" || true)
          rm -f "$results_file"

          if [ "$failures" -gt 0 ]; then
            printf '\n%s route(s) failed health checks.\n' "$failures"
            exit 1
          fi

          printf '\nAll %s gateway routes are responding.\n' "${#urls[@]}"
